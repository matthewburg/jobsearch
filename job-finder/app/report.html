<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/report.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><a class="logo" href="#home" aria-label="Job Search home"><img src="/favicon.svg" alt="" width="26" height="26"><h1>Job Search</h1></a><span class="sub" id="sub"></span></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#home" data-view="home">Home</a>
      <a href="#jobs" data-view="jobs">Jobs</a>
      <a href="#documents" data-view="documents">Documents<span class="badge ok" id="nav-docs" hidden></span></a>
      <a href="#profile" data-view="profile">Profile</a>
      <a href="#activity" data-view="activity">Activity</a>
      <a href="#setup" data-view="setup">Setup<span class="badge" id="nav-setup" hidden></span></a>
    </nav>
  </div>
</header>
<main class="wrap">
  <section class="view" id="view-home" hidden></section>

  <section class="view" id="view-jobs" hidden>
    <div class="toolbar" id="jobs-toolbar">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="controls">
        <input type="search" id="q" placeholder="Search title, company…" aria-label="Search jobs">
        <select id="sort" aria-label="Sort">
          <option value="score">Best fit</option>
          <option value="pay">Highest pay (midpoint)</option>
          <option value="newest">Newest posting</option>
          <option value="company">Company A–Z</option>
        </select>
        <button class="toggle" data-f="remote" aria-pressed="false">Remote</button>
        <button class="toggle" data-f="payok" aria-pressed="false">Pay ≥ floor</button>
        <button class="toggle" data-f="fresh" aria-pressed="false">Hide stale</button>
        <button class="toggle" data-f="ai" aria-pressed="false">AI-forward</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div id="list"></div>
  </section>

  <section class="view" id="view-documents" hidden></section>
  <section class="view" id="view-profile" hidden></section>
  <section class="view" id="view-activity" hidden></section>
  <section class="view" id="view-setup" hidden></section>
</main>
<dialog class="co-page" id="co-page"></dialog>
<dialog class="sheet" id="sheet"></dialog>
<script src="/report.js"></script>
</body>
</html>
